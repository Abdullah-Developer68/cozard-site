<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" preserveAspectRatio="xMidYMid slice" font-family="Geist Variable, Geist, system-ui, sans-serif" role="img" aria-label="Parcel shipping API logs and latency">
