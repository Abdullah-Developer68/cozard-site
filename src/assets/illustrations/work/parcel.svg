<text x="16" y="72"><tspan fill="#7FA6D6">POST</tspan><tspan fill="#E2DFD6"> /v3/labels</tspan><tspan x="214" fill="#fff">201</tspan><tspan x="246" fill="#8C8A84">88ms</tspan></text>
<text x="16" y="92"><tspan fill="#4CC38A">GET </tspan><tspan fill="#E2DFD6"> /v3/track/PX-2198</tspan><tspan x="214" fill="#fff">200</tspan><tspan x="246" fill="#8C8A84">36ms</tspan></text>
<text x="16" y="112"><tspan fill="#D9D5CA">PUT </tspan><tspan fill="#E2DFD6"> /v3/parcels/PX-2201</tspan><tspan x="214" fill="#fff">200</tspan><tspan x="246" fill="#8C8A84">52ms</tspan></text>
<text x="16" y="132"><tspan fill="#7FA6D6">POST</tspan><tspan fill="#E2DFD6"> /v3/webhooks/courier</tspan><tspan x="214" fill="#fff">202</tspan><tspan x="246" fill="#8C8A84">19ms</tspan></text>
<text x="16" y="152"><tspan fill="#4CC38A">GET </tspan><tspan fill="#E2DFD6"> /v3/rates?zone=4</tspan><tspan x="214" fill="#fff">200</tspan><tspan x="246" fill="#8C8A84">28ms</tspan></text>
<text x="16" y="172"><tspan fill="#4CC38A">GET </tspan><tspan fill="#E2DFD6"> /v3/track/PX-2204</tspan><tspan x="214" fill="#fff">200</tspan><tspan x="246" fill="#8C8A84">33ms</tspan></text>
<text x="16" y="198" fill="#8C8A84">› deploy v3.14.2 · eu-west-1 · healthy</text>
<text x="16" y="218"><tspan fill="#4CC38A">$</tspan><tspan fill="#E2DFD6"> </tspan></text>
